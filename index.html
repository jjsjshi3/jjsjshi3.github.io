<script>
(function(){
  var MIN_DELAY_MS=3000; // 按钮至少转圈多久（毫秒），想更久就改这里
  var form=document.querySelector('form.form');
  var ta=document.getElementById('question');
  var ph=document.querySelector('.textarea-placeholder');
  var box=document.querySelector('.textarea-container');
  var modal=document.getElementById('videoModal');
  var video=document.getElementById('popupVideo');
  var closeBtn=document.getElementById('videoClose');
  var btn=form.querySelector('.submit');
  var busy=false;

  // 占位文字与输入内容互斥，避免重叠
  function syncPlaceholder(){ ph.classList.toggle('hidden', ta.value.length>0); }
  ['input','focus','change'].forEach(function(ev){ ta.addEventListener(ev,syncPlaceholder); });
  var dice=document.querySelector('.dice-button');
  if(dice) dice.addEventListener('click',function(){setTimeout(syncPlaceholder,0);});
  syncPlaceholder();

  function isFs(){ return document.fullscreenElement||document.webkitFullscreenElement; }
  function enterFs(el){
    var f=el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen;
    if(f){ try{ var r=f.call(el); if(r&&r.catch) r.catch(function(){}); }catch(e){} }
  }
  function exitFs(){
    if(!isFs()) return;
    var f=document.exitFullscreen||document.webkitExitFullscreen;
    if(f){ try{ var r=f.call(document); if(r&&r.catch) r.catch(function(){}); }catch(e){} }
  }

  function closeVideo(){
    modal.classList.remove('show');
    video.pause();
    try{ video.currentTime=0; }catch(e){}
    exitFs();
    btn.disabled=false;
    busy=false;
  }
  closeBtn.addEventListener('click',closeVideo);
  video.addEventListener('ended',closeVideo);
  ['fullscreenchange','webkitfullscreenchange'].forEach(function(ev){
    document.addEventListener(ev,function(){
      if(!isFs() && modal.classList.contains('show')) closeVideo();
    });
  });

  // 等待视频可完整播放；失败则 reject
  function videoReady(){
    return new Promise(function(resolve,reject){
      if(video.error) return reject();
      if(video.readyState>=4) return resolve();
      function ok(){ cleanup(); resolve(); }
      function bad(){ cleanup(); reject(); }
      function cleanup(){
        video.removeEventListener('canplaythrough',ok);
        video.removeEventListener('error',bad);
      }
      video.addEventListener('canplaythrough',ok);
      video.addEventListener('error',bad);
      if(video.readyState===0 && video.networkState===3){ try{ video.load(); }catch(e){} }
    });
  }
  function wait(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }

  function playFullscreen(){
    modal.classList.add('show');
    video.muted=false;
    enterFs(modal);
    // iOS Safari 不支持元素全屏，用视频自带全屏
    if(!document.documentElement.requestFullscreen && !document.documentElement.webkitRequestFullscreen && video.webkitEnterFullscreen){

        video.muted=true; // 有声自动播放被拦截时，退回静音
        video.play().catch(function(){});
      });
    }
  }

    if(busy) return;

    // 必须有内容才能提交
    if(!ta.value.trim()){
      ta.focus();
      box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
      return;
    }

    busy=true;
    btn.disabled=true; // 按钮转圈，留在当前页面

    // 至少转圈 MIN_DELAY_MS，且视频加载完成后才播放；没加载完就一直转
    Promise.all([wait(MIN_DELAY_MS),videoReady()]).then(playFullscreen).catch(function(){
      btn.disabled=false;
      busy=false;
      alert('视频加载失败，请确认 video.mp4 与 HTML 在同一目录');
    });
  });
})();
</script>
