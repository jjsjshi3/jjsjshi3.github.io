<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <!-- 移动端适配 + 尽可能禁止缩放 -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <meta name="theme-color" content="#ffffff">
  <meta name="format-detection" content="telephone=no">

  <title>CLOUDZ.FUN</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #fff;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      position: fixed;
      inset: 0;

      display: flex;
      justify-content: center;
      align-items: center;

      color: #111;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;

      touch-action: pan-x pan-y;
    }

    #message {
      width: 100%;
      max-width: 100%;
      min-height: 1.5em;

      padding: 0 24px;

      text-align: center;

      font-size: clamp(14px, 2.5vw, 17px);
      font-weight: 400;
      letter-spacing: 0.04em;
      line-height: 1.8;

      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: normal;
    }

    #cursor {
      display: inline-block;
      width: 1px;
      height: 1em;
      margin-left: 3px;
      background: currentColor;
      vertical-align: -0.12em;
      animation: blink 0.7s steps(1, end) infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    @media (max-width: 600px) {
      #message {
        padding-left: 28px;
        padding-right: 28px;
        font-size: 15px;
        line-height: 1.9;
        letter-spacing: 0.03em;
      }
    }

    @media (max-height: 400px) {
      #message {
        font-size: 14px;
        line-height: 1.5;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #cursor {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <div id="message"><span id="typed"></span><span id="smiley"></span><span id="cursor" aria-hidden="true"></span></div>

  <script>
    // =================================
    // 自定义设置
    // =================================

    const text =
      "谢谢你点进来 但是没有人了解我 所以你可以退出了";

    const duration = 2300;       // 正文动画时长，单位 ms
    const typoDuration = 150;    // 正文打错字并退格的时间
    const wrongChar = "X";       // 故意打错的字符

    const smiley = ":)";         // 正文后面出现的内容
    const smileyDelay = 800;     // 正文完成后，延迟多少 ms 出现
    const smileySpeed = 180;     // 笑脸每个字符的输入间隔

    // =================================
    // 元素与计时器
    // =================================

    const typed = document.getElementById("typed");
    const smileyElement = document.getElementById("smiley");

    const sleep = ms =>
      new Promise(resolve => setTimeout(resolve, ms));

    // =================================
    // 打字机动画
    // =================================

    async function typeText() {
      typed.textContent = "";
      smileyElement.textContent = "";

      const count = text.length;

      if (count === 0) return;

      const hasTypo = count >= 2;
      const typoAt = Math.min(4, count - 1);

      const typingDuration = Math.max(
        0,
        duration - (hasTypo ? typoDuration : 0)
      );

      const interval = typingDuration / count;

      // 输入正文前半段
      for (
        let i = 0;
        i < (hasTypo ? typoAt : count);
        i++
      ) {
        typed.textContent += text[i];
        await sleep(interval);
      }

      // 故意打错，再退格修正
      if (hasTypo) {
        typed.textContent += wrongChar;

        await sleep(typoDuration * 0.65);

        typed.textContent =
          typed.textContent.slice(0, -1);

        await sleep(typoDuration * 0.35);

        // 输入正文剩余部分
        for (let i = typoAt; i < count; i++) {
          typed.textContent += text[i];

          if (i < count - 1) {
            await sleep(interval);
          }
        }
      }

      // =================================
      // 正文结束后，延迟出现 :)
      // =================================

      await sleep(smileyDelay);

      for (const char of smiley) {
        smileyElement.textContent += char;
        await sleep(smileySpeed);
      }
    }

    // =================================
    // 尽可能阻止移动端缩放手势
    // =================================

    document.addEventListener(
      "gesturestart",
      event => event.preventDefault(),
      { passive: false }
    );

    document.addEventListener(
      "gesturechange",
      event => event.preventDefault(),
      { passive: false }
    );

    document.addEventListener(
      "gestureend",
      event => event.preventDefault(),
      { passive: false }
    );

    // 阻止双击缩放
    let lastTouchEnd = 0;

    document.addEventListener(
      "touchend",
      event => {
        const now = Date.now();

        if (now - lastTouchEnd <= 300) {
          event.preventDefault();
        }

        lastTouchEnd = now;
      },
      { passive: false }
    );

    // 阻止右键菜单
    document.addEventListener(
      "contextmenu",
      event => event.preventDefault()
    );

    // 开始动画
    typeText();
  </script>

</body>
</html>
