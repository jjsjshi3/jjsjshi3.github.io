<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#240306">
<title>Lucky Wheel — Spin to Win</title>
<style>
:root{
  --bg-deep:#240306; --bg-2:#350508; --burgundy:#510710;
  --red:#F01935; --red-bright:#FF334D; --red-hi:#FF5265;
  --gold:#FFD580; --gold-deep:#C98F3C;
  --text:#FFF8F5; --text-2:#E5BFC3;
  --size: clamp(250px, min(90vw, calc(100vh - 270px)), 600px);
  --size: clamp(250px, min(90vw, calc(100dvh - 270px)), 600px);
  --font: "Inter","SF Pro Display","Segoe UI","Helvetica Neue",Roboto,system-ui,-apple-system,Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh; min-height:100dvh; overflow-x:hidden;
  font-family:var(--font); color:var(--text);
  background:
    radial-gradient(ellipse 60% 50% at 50% 44%, rgba(240,25,53,.30), transparent 70%),
    radial-gradient(circle at 12% 8%, rgba(255,82,101,.12), transparent 42%),
    radial-gradient(circle at 90% 20%, rgba(201,40,70,.14), transparent 40%),
    radial-gradient(ellipse 90% 60% at 50% 120%, var(--burgundy), transparent 65%),
    linear-gradient(180deg, var(--bg-2), var(--bg-deep) 70%);
  background-attachment:fixed;
  -webkit-tap-highlight-color:transparent;
}
body::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:3;
  background:radial-gradient(ellipse at 50% 50%, transparent 52%, rgba(10,0,2,.6) 100%);
}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

.bg-particles{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.bg-particles i{
  position:absolute; bottom:-12px; border-radius:50%;
  background:radial-gradient(circle,rgba(255,213,128,.75),rgba(255,213,128,0) 70%);
  opacity:0; animation:floatUp linear infinite;
}
@keyframes floatUp{
  0%{transform:translate3d(0,0,0);opacity:0}
  15%{opacity:.55} 85%{opacity:.35}
  100%{transform:translate3d(var(--dx),-108vh,0);opacity:0}
}

.app{
  position:relative; z-index:2; min-height:100vh; min-height:100dvh;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:clamp(10px,2vh,22px);
  padding:max(18px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));
}
.brand{
  margin:0; font-size:clamp(.66rem,1.9vw,.8rem); font-weight:600;
  letter-spacing:.46em; text-indent:.46em; text-transform:uppercase; color:var(--gold);
  display:flex; align-items:center; gap:12px;
}
.brand::before,.brand::after{content:"";width:clamp(18px,6vw,40px);height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.brand::after{transform:scaleX(-1)}
.headline{
  margin:0; text-align:center; font-weight:800; line-height:1.1; letter-spacing:-.01em;
  font-size:clamp(1.45rem,4.6vw,2.6rem);
  background:linear-gradient(180deg,#fff 20%,#ffe3b0 100%); -webkit-background-clip:text; background-clip:text; color:transparent;
  text-shadow:none;
}

.stage{position:relative;width:var(--size);height:var(--size);margin-top:calc(var(--size)*.045);flex:none}
.glow{position:absolute;inset:-22%;pointer-events:none;border-radius:50%;
  background:radial-gradient(circle,rgba(255,51,77,.40),rgba(240,25,53,.15) 46%,transparent 68%);
  animation:breathe 6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.75;transform:scale(.98)}50%{opacity:1;transform:scale(1.03)}}
.base{position:absolute;inset:0;border-radius:50%;background:#2a0407;
  box-shadow:0 34px 70px rgba(0,0,0,.68),0 0 0 1px rgba(255,213,128,.18)}
.wheel,.overlay{position:absolute;inset:0;width:100%;height:100%;display:block}
.wheel{will-change:transform;transform-origin:50% 50%}
.wheel text{font-family:var(--font);font-weight:800;text-anchor:middle;paint-order:stroke;stroke-linejoin:round}
.overlay{pointer-events:none}
.b0{animation:bulb 1.6s ease-in-out infinite}
.b1{animation:bulb 1.6s ease-in-out infinite .8s}
@keyframes bulb{0%,100%{opacity:1}50%{opacity:.45}}

.pointer{
  position:absolute; left:50%; top:-4.4%; width:10.5%; aspect-ratio:100/140; margin-left:-5.25%;
  transform-origin:50% 28%; z-index:5; pointer-events:none;
  filter:drop-shadow(0 6px 7px rgba(0,0,0,.55));
}
.pointer svg{display:block;width:100%;height:100%}

.spin{
  position:absolute; left:50%; top:50%; width:21%; aspect-ratio:1; margin:-10.5% 0 0 -10.5%;
  z-index:4; border:0; padding:0; border-radius:50%; cursor:pointer;
  font-family:var(--font); font-weight:800; font-size:calc(var(--size)*.05);
  letter-spacing:.14em; text-indent:.14em; color:var(--text);
  text-shadow:0 2px 4px rgba(60,0,10,.6);
  background:radial-gradient(circle at 35% 26%, #ff7d8d 0%, var(--red) 40%, #a30d24 100%);
  box-shadow:
    0 0 0 calc(var(--size)*.007) var(--gold),
    0 0 0 calc(var(--size)*.013) #7a4a14,
    0 calc(var(--size)*.012) calc(var(--size)*.03) rgba(0,0,0,.6),
    inset 0 calc(var(--size)*.006) calc(var(--size)*.012) rgba(255,255,255,.45),
    inset 0 calc(var(--size)*-.012) calc(var(--size)*.02) rgba(80,0,12,.55);
  transition:transform .12s ease, filter .3s ease, box-shadow .12s ease;
  touch-action:manipulation; -webkit-user-select:none; user-select:none;
}
.spin::after{
  content:""; position:absolute; inset:-9%; border-radius:50%; pointer-events:none;
  border:2px solid rgba(255,213,128,.65); animation:ring 2.4s ease-out infinite;
}
@keyframes ring{0%{transform:scale(.92);opacity:.8}100%{transform:scale(1.22);opacity:0}}
.spin:hover:not(:disabled){filter:brightness(1.1)}
.spin:active:not(:disabled){transform:scale(.94)}
.spin:disabled{filter:brightness(.6) saturate(.7);cursor:default;pointer-events:none;box-shadow:
    0 0 0 calc(var(--size)*.007) #a88747,0 0 0 calc(var(--size)*.013) #4d3410,
    0 calc(var(--size)*.012) calc(var(--size)*.03) rgba(0,0,0,.6)}
.spin:disabled::after{display:none}

.controls{display:flex;gap:12px;margin-top:clamp(4px,1vh,12px)}
.ctl{
  width:46px;height:46px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
  color:var(--gold); background:rgba(81,7,16,.55); border:1px solid rgba(255,213,128,.35);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  transition:background .2s,color .2s,border-color .2s,transform .1s; touch-action:manipulation;
}
.ctl:active{transform:scale(.93)}
.ctl svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ctl .slash{opacity:0;transition:opacity .2s}
.ctl[aria-pressed="false"]{color:var(--text-2);border-color:rgba(229,191,195,.25);background:rgba(36,3,6,.55)}
.ctl[aria-pressed="false"] .slash{opacity:1}

/* Modal */
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;overflow:auto;
  background:rgba(12,0,3,.78); opacity:0; transition:opacity .35s ease}
.modal[hidden]{display:none}
.modal.open{opacity:1}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.modal-card{
  position:relative; z-index:1; width:min(100%,420px); max-height:calc(100vh - 32px); max-height:calc(100dvh - 32px);
  overflow:auto; text-align:center; border-radius:26px; padding:clamp(20px,5vw,34px) clamp(18px,5vw,30px);
  background:radial-gradient(ellipse 90% 60% at 50% 0%, rgba(255,82,101,.32), transparent 70%),
             linear-gradient(170deg,#5a0a14 0%,#350508 55%,#240306 100%);
  border:1px solid rgba(255,213,128,.55);
  box-shadow:0 0 0 5px rgba(255,213,128,.08),0 30px 80px rgba(0,0,0,.7),0 0 70px rgba(240,25,53,.35),inset 0 1px 0 rgba(255,255,255,.18);
  transform:translateY(24px) scale(.92); opacity:0;
  transition:transform .55s cubic-bezier(.2,1.2,.3,1), opacity .4s ease;
}
.modal.open .modal-card{transform:none;opacity:1}
.modal-card:focus{outline:none}
.eyebrow{margin:0 0 8px;font-size:.7rem;letter-spacing:.4em;text-indent:.4em;text-transform:uppercase;color:var(--gold);font-weight:600}
.m-title{margin:0;font-size:clamp(1.25rem,6vw,1.75rem);font-weight:800;letter-spacing:.06em;line-height:1.15}
.m-sub{margin:10px 0 0;font-size:clamp(.8rem,3.2vw,.95rem);letter-spacing:.42em;text-indent:.42em;font-weight:700;color:var(--text-2)}
.m-amount{
  margin:2px 0 4px; font-weight:900; line-height:1; letter-spacing:-.03em;
  font-size:clamp(92px,31vw,160px);
  background:linear-gradient(180deg,#fff6dc 5%,var(--gold) 45%,#d99a43 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px rgba(255,213,128,.5)) drop-shadow(0 6px 10px rgba(0,0,0,.45));
  animation:pulseAmt 2.6s ease-in-out infinite;
}
@keyframes pulseAmt{0%,100%{filter:drop-shadow(0 0 18px rgba(255,213,128,.4)) drop-shadow(0 6px 10px rgba(0,0,0,.45))}
  50%{filter:drop-shadow(0 0 32px rgba(255,213,128,.75)) drop-shadow(0 6px 10px rgba(0,0,0,.45))}}
.m-note{
  margin:6px auto 0; max-width:30ch; font-size:clamp(.88rem,3.6vw,1rem); line-height:1.45; color:var(--text);
  padding:12px 14px; border-radius:14px; background:rgba(255,213,128,.09); border:1px dashed rgba(255,213,128,.5);
}
.m-note svg{width:18px;height:18px;vertical-align:-3px;margin-right:6px;fill:none;stroke:var(--gold);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.m-actions{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.btn{
  min-height:46px; padding:0 24px; border-radius:999px; font:700 .9rem var(--font); letter-spacing:.08em; cursor:pointer;
  border:1px solid rgba(255,213,128,.6); color:var(--text); background:rgba(255,255,255,.06); touch-action:manipulation;
}
.btn.primary{background:linear-gradient(180deg,var(--gold),#d99a43);color:#4a060e;border-color:transparent}
.btn[hidden]{display:none}

@media (max-width:360px){.modal-card{border-radius:20px}}
@media (prefers-reduced-motion:reduce){
  .glow,.b0,.b1,.spin::after,.m-amount,.bg-particles i{animation:none}
  .bg-particles{display:none}
  .modal,.modal-card{transition:opacity .2s}
}
</style>
</head>
<body>
<div class="bg-particles" id="particles" aria-hidden="true"></div>

<main class="app" id="app">
  <p class="brand">幸运转盘</p>
  <h1 class="headline">Spin &amp; claim </h1>

  <section class="stage" id="stage" aria-label="Prize wheel">
    <div class="glow"></div>
    <div class="base"></div>
    <svg class="wheel" id="wheel" viewBox="0 0 1000 1000" role="img" aria-label="Prize wheel with six sectors: 100, 0.5, 0.9, 20, 3 and 10"></svg>
    <svg class="overlay" id="overlay" viewBox="0 0 1000 1000" aria-hidden="true"></svg>
    <div class="pointer" id="pointer" aria-hidden="true">
      <svg viewBox="0 0 100 140">
        <defs>
          <linearGradient id="ptGold" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#FFF1CC"/><stop offset=".45" stop-color="#FFD580"/><stop offset="1" stop-color="#B9812F"/>
          </linearGradient>
          <radialGradient id="ptJewel" cx=".35" cy=".3" r=".8">
            <stop offset="0" stop-color="#FF8A98"/><stop offset=".5" stop-color="#F01935"/><stop offset="1" stop-color="#7a0a1b"/>
          </radialGradient>
        </defs>
        <path d="M50 136 C50 136 12 82 12 50 A38 38 0 0 1 88 50 C88 82 50 136 50 136 Z" fill="url(#ptGold)" stroke="#7a4a14" stroke-width="2"/>
        <circle cx="50" cy="48" r="17" fill="#5a0a14" stroke="#FFE9B8" stroke-width="2"/>
        <circle cx="50" cy="48" r="12" fill="url(#ptJewel)"/>
        <circle cx="45" cy="43" r="3.4" fill="#fff" opacity=".7"/>
      </svg>
    </div>
    <button class="spin" id="spinBtn" type="button" aria-label="Spin the wheel">SPIN</button>
  </section>

  <div class="controls" role="group" aria-label="Audio controls">
    <button class="ctl" id="musicBtn" type="button" aria-pressed="true" aria-label="Background music" title="Background music">
      <svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/><path class="slash" d="M3 3l18 18"/></svg>
    </button>
    <button class="ctl" id="sfxBtn" type="button" aria-pressed="true" aria-label="Sound effects" title="Sound effects">
      <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 010 7"/><path d="M19 6a8.5 8.5 0 010 12"/><path class="slash" d="M3 3l18 18"/></svg>
    </button>
  </div>
  <p class="sr-only" id="live" aria-live="polite"></p>
</main>

<div class="modal" id="modal" hidden>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <div class="modal-card" id="modalCard" role="dialog" aria-modal="true" aria-labelledby="mTitle" aria-describedby="mNote" tabindex="-1">
    <p class="eyebrow">A moment of fortune</p>
    <h2 class="m-title" id="mTitle">CONGRATULATIONS!</h2>
    <p class="m-sub">YOU WON</p>
    <div class="m-amount" id="mAmount">100</div>
    <p class="m-note" id="mNote">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>RM100!
    </p>
    <div class="m-actions">
      <button class="btn" id="shareBtn" type="button" hidden>SHARE</button>
      <button class="btn primary" id="closeBtn" type="button">CLOSE</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';

/* ==========================================================================
   1–4. CONFIGURATION, PRIZES, GEOMETRY  (single source of truth)
   ========================================================================== */
/*#MATH_START*/
const PRIZES = [
  { label: 'RM 100', win: true,  fill: 'gold' },
  { label: 'RM 20', nearMiss: true, fill: '#FF334D' },
  { label: 'RM 30', fill: '#C8102E' },
  { label: 'RM 66',  fill: '#F01935' },
  { label: 'RM 15',   fill: '#B20F28' },
  { label: 'RM 10',  fill: '#F01935' }
];
const SECTOR_COUNT = PRIZES.length;            // 6
const SECTOR_ANGLE = 360 / SECTOR_COUNT;       // 60°
/* Angle convention: degrees measured CLOCKWISE from 12 o'clock — identical for the
   SVG layout (polar() below), the CSS rotate() transform and the pointer (12 o'clock). */
const POINTER_ANGLE = 0;
const WIN_INDEX = PRIZES.findIndex(p => p.win);
const NEAR_MISS_INDEX = PRIZES.findIndex(p => p.nearMiss);
const FULL_TURNS = 8;

const mod = (n, m) => ((n % m) + m) % m;
const sectorCenter = i => i * SECTOR_ANGLE;                      // wheel-local centre angle
/* Wheel rotation R (mod 360) that puts sector i's centre under the pointer. */
const restingResidue = i => mod(POINTER_ANGLE - sectorCenter(i), 360);
/* Which sector is under the pointer for rotation R. */
function sectorUnderPointer(R) {
  const local = mod(POINTER_ANGLE - R, 360);
  return Math.floor(mod(local + SECTOR_ANGLE / 2, 360) / SECTOR_ANGLE) % SECTOR_COUNT;
}
/* Wheel turns clockwise; sectors pass the pointer in DEcreasing index order.
   d = how many sectors before the winner the near-miss sector sits. */
const NEAR_STEPS = mod(NEAR_MISS_INDEX - WIN_INDEX, SECTOR_COUNT);           // 1
const NEAR_MISS_OFFSET = -(NEAR_STEPS * SECTOR_ANGLE - SECTOR_ANGLE / 2) - 4; // -34: 4° before leaving "0.5"

/* ===== Motion timeline: cubic-Hermite segments through (time, angle, velocity) knots ===== */
function hermite(p0, p1, m0, m1, T, s) {
  const s2 = s * s, s3 = s2 * s;
  const p = (2*s3 - 3*s2 + 1) * p0 + (s3 - 2*s2 + s) * T * m0 + (-2*s3 + 3*s2) * p1 + (s3 - s2) * T * m1;
  const v = ((6*s2 - 6*s) * p0 + (3*s2 - 4*s + 1) * T * m0 + (-6*s2 + 6*s) * p1 + (3*s2 - 2*s) * T * m1) / T;
  return { p, v };
}
function buildTimeline(startR, reduced) {
  const res = restingResidue(WIN_INDEX);
  if (reduced) {
    const finalR = res + 360 * (Math.ceil((startR - res) / 360) + 2);
    return { finalR, total: 2.4, riserAt: null, riserDur: 0,
      knots: [{ t: 0, p: startR, v: 0 }, { t: 2.4, p: finalR, v: 0 }] };
  }
  const finalR = res + 360 * (Math.ceil((startR - res) / 360) + FULL_TURNS); // exact integer multiple
  const knots = [
    { t: 0,   p: startR,                    v: 0   },   // rest
    { t: 1.3, p: finalR - 2280,             v: 960 },   // acceleration
    { t: 2.3, p: finalR - 1350,             v: 900 },   // full speed
    { t: 5.3, p: finalR - 100,              v: 60  },   // long deceleration
    { t: 6.8, p: finalR + NEAR_MISS_OFFSET, v: 4   },   // crawl: "0.5" under pointer, almost stopped
    { t: 7.4, p: finalR - 14,               v: 30  },   // creeps past the boundary
    { t: 8.2, p: finalR + 3,                v: 8   },   // gentle overshoot of the target
    { t: 8.8, p: finalR,                    v: 0   }    // settle exactly on target
  ];
  return { finalR, knots, total: 8.8, riserAt: knots[3].t, riserDur: knots[5].t - knots[3].t + 0.4 };
}
function sample(tl, t) {
  if (t >= tl.total) return { p: tl.finalR, v: 0 };
  const K = tl.knots; let i = 1;
  while (i < K.length - 1 && t > K[i].t) i++;
  const a = K[i - 1], b = K[i], T = b.t - a.t;
  const s = Math.min(1, Math.max(0, (t - a.t) / T));
  return hermite(a.p, b.p, a.v, b.v, T, s);
}
/*#MATH_END*/

/* ==========================================================================
   5. DOM + WHEEL RENDERING (derived from PRIZES)
   ========================================================================== */
const $ = s => document.querySelector(s);
const wheelEl = $('#wheel'), overlayEl = $('#overlay'), stageEl = $('#stage'), pointerEl = $('#pointer');
const spinBtn = $('#spinBtn'), liveEl = $('#live');
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

const polar = (r, deg) => {
  const a = deg * Math.PI / 180;
  return [+(500 + r * Math.sin(a)).toFixed(3), +(500 - r * Math.cos(a)).toFixed(3)];
};

function renderWheel() {
  const R = 430, LABEL_R = 312;
  let sectors = '', labels = '', pegs = '';
  PRIZES.forEach((p, i) => {
    const a0 = i * SECTOR_ANGLE - SECTOR_ANGLE / 2, a1 = a0 + SECTOR_ANGLE;
    const [x0, y0] = polar(R, a0), [x1, y1] = polar(R, a1);
    const fill = p.fill === 'gold' ? 'url(#wGold)' : p.fill;
    sectors += `<path d="M500 500L${x0} ${y0}A${R} ${R} 0 0 1 ${x1} ${y1}Z" fill="${fill}" stroke="#FFD580" stroke-opacity=".9" stroke-width="3.5" stroke-linejoin="round"/>`;
    const [px, py] = polar(412, a0);
    pegs += `<circle cx="${px}" cy="${py}" r="11" fill="url(#wPeg)" stroke="#6b3f10" stroke-width="2"/>`;
    const size = p.win ? 150 : 118;
    const textStyle = p.win
      ? 'fill="#4A060E" stroke="rgba(255,255,255,.45)" stroke-width="5"'
      : 'fill="#FFF8F5" stroke="rgba(70,0,10,.55)" stroke-width="9"';
    labels += `<g transform="rotate(${i * SECTOR_ANGLE} 500 500)">` +
      `<text x="500" y="${500 - LABEL_R}" dy=".35em" font-size="${size}" ${textStyle}>${p.label}</text>` +
      `<circle cx="500" cy="${500 - 392}" r="7" fill="${p.win ? '#7a0f1c' : '#FFD580'}" opacity=".9"/>` +
      (p.win ? `<circle class="win-marker" id="winMarker" cx="500" cy="${500 - LABEL_R}" r="2" fill="none"/>` : '') +
      `</g>`;
  });
  wheelEl.innerHTML = `
    <defs>
      <radialGradient id="wGold" cx="500" cy="500" r="430" gradientUnits="userSpaceOnUse">
        <stop offset=".25" stop-color="#D9A04A"/><stop offset=".62" stop-color="#FFD580"/><stop offset="1" stop-color="#FFEFC4"/>
      </radialGradient>
      <radialGradient id="wDepth" cx="500" cy="500" r="430" gradientUnits="userSpaceOnUse">
        <stop offset=".28" stop-color="#2a0309" stop-opacity=".5"/><stop offset=".7" stop-color="#000" stop-opacity="0"/>
        <stop offset="1" stop-color="#ff8a98" stop-opacity=".2"/>
      </radialGradient>
      <radialGradient id="wPeg" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFF6D8"/><stop offset=".6" stop-color="#FFD580"/><stop offset="1" stop-color="#B9812F"/></radialGradient>
    </defs>
    ${sectors}
    <circle cx="500" cy="500" r="430" fill="url(#wDepth)"/>
    <circle cx="500" cy="500" r="418" fill="none" stroke="#FFD580" stroke-opacity=".55" stroke-width="2"/>
    ${labels}${pegs}`;
}

function renderOverlay() {
  let bulbs = '';
  for (let i = 0; i < 24; i++) {
    const [x, y] = polar(462, i * 15);
    bulbs += `<circle class="b${i % 2}" cx="${x}" cy="${y}" r="11" fill="url(#oBulb)" stroke="#8a5a1c" stroke-width="1.5"/>`;
  }
  overlayEl.innerHTML = `
    <defs>
      <linearGradient id="oGold" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#FFF2CF"/><stop offset=".22" stop-color="#FFD580"/><stop offset=".45" stop-color="#B8812F"/>
        <stop offset=".62" stop-color="#FFE3A3"/><stop offset=".85" stop-color="#9C6A26"/><stop offset="1" stop-color="#FFD580"/>
      </linearGradient>
      <radialGradient id="oBulb" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFFBEA"/><stop offset=".55" stop-color="#FFD580"/><stop offset="1" stop-color="#C98F3C"/></radialGradient>
      <radialGradient id="oSheen" cx=".32" cy=".24" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".45" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
      <radialGradient id="oHub" cx=".38" cy=".3" r=".85"><stop offset="0" stop-color="#8a1224"/><stop offset=".6" stop-color="#4a0710"/><stop offset="1" stop-color="#2a0409"/></radialGradient>
    </defs>
    <circle cx="500" cy="500" r="462" fill="none" stroke="url(#oGold)" stroke-width="64"/>
    <circle cx="500" cy="500" r="494" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="3"/>
    <circle cx="500" cy="500" r="431" fill="none" stroke="#5a0a14" stroke-width="7"/>
    <circle cx="500" cy="500" r="426" fill="none" stroke="#FFD580" stroke-width="3" stroke-opacity=".9"/>
    ${bulbs}
    <circle cx="500" cy="500" r="430" fill="url(#oSheen)"/>
    <circle cx="500" cy="500" r="172" fill="rgba(0,0,0,.28)"/>
    <circle cx="500" cy="500" r="158" fill="url(#oGold)"/>
    <circle cx="500" cy="500" r="146" fill="#3a0509"/>
    <circle cx="500" cy="500" r="140" fill="url(#oHub)" stroke="rgba(0,0,0,.5)" stroke-width="4"/>`;
}

function renderParticles() {
  if (reducedMotion.matches) return;
  const host = $('#particles'); let html = '';
  for (let i = 0; i < 16; i++) {
    const s = 3 + Math.random() * 5;
    html += `<i style="left:${(Math.random() * 100).toFixed(1)}%;width:${s.toFixed(1)}px;height:${s.toFixed(1)}px;` +
            `--dx:${((Math.random() - .5) * 80).toFixed(0)}px;animation-duration:${(14 + Math.random() * 16).toFixed(1)}s;` +
            `animation-delay:${(-Math.random() * 20).toFixed(1)}s"></i>`;
  }
  host.innerHTML = html;
}

/* ==========================================================================
   6. LOCALSTORAGE STATE (one spin per browser) with in-memory fallback
   ========================================================================== */
const SpinStore = (() => {
  const KEY = 'premiumLuckyWheel_spinState_v1';
  let memory = false;
  function isConsumed() {
    if (memory) return true;
    try { return window.localStorage.getItem(KEY) !== null; } catch (e) { return false; }
  }
  function consume() {
    memory = true;
    try { window.localStorage.setItem(KEY, JSON.stringify({ consumed: true, at: Date.now() })); } catch (e) { /* memory fallback holds */ }
  }
  return { KEY, isConsumed, consume };
})();

/* ==========================================================================
   7. WEB AUDIO ENGINE (all procedural)
   ========================================================================== */
const AudioEngine = (() => {
  const AC = window.AudioContext || window.webkitAudioContext;
  const MUSIC_VOL = 0.5, SFX_VOL = 0.85, CHORD_LEN = 4;
  const CHORDS = [
    [110.00, 220.00, 261.63, 329.63],   // Am
    [87.31,  174.61, 220.00, 261.63],   // F
    [130.81, 196.00, 261.63, 329.63],   // C
    [98.00,  196.00, 246.94, 293.66]    // G
  ];
  const BELLS = [523.25, 587.33, 659.25, 783.99, 880.00];
  let ctx = null, master = null, sfxBus = null, musicBus = null, musicFilter = null;
  let sfxOn = true, musicOn = true, gestured = false;
  let schedTimer = null, nextChordAt = 0, chordIdx = 0, riser = null;
  const liveMusic = new Set();

  function init() {
    if (!AC) return false;
    if (ctx) return true;
    try {
      ctx = new AC();
      const comp = ctx.createDynamicsCompressor();
      master = ctx.createGain(); master.gain.value = 0.9;
      sfxBus = ctx.createGain(); sfxBus.gain.value = sfxOn ? SFX_VOL : 0;
      musicBus = ctx.createGain(); musicBus.gain.value = 0;
      musicFilter = ctx.createBiquadFilter(); musicFilter.type = 'lowpass'; musicFilter.frequency.value = 1400;
      musicFilter.connect(musicBus); musicBus.connect(master); sfxBus.connect(master);
      master.connect(comp); comp.connect(ctx.destination);
      return true;
    } catch (e) { ctx = null; return false; }
  }
  function unlock() {
    if (!init()) return;
    gestured = true;
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    if (musicOn) startMusic();
  }
  function track(o, g) {
    liveMusic.add(o);
    o.onended = () => { liveMusic.delete(o); try { o.disconnect(); g.disconnect(); } catch (e) {} };
  }
  function scheduleChord(t) {
    const chord = CHORDS[chordIdx++ % CHORDS.length];
    chord.forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = i === 0 ? 'sine' : 'triangle'; o.frequency.value = f; o.detune.value = (i - 1.5) * 4;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(i === 0 ? 0.07 : 0.035, t + 1.4);
      g.gain.linearRampToValueAtTime(i === 0 ? 0.05 : 0.025, t + 3.0);
      g.gain.linearRampToValueAtTime(0, t + CHORD_LEN + 1.2);
      o.connect(g); g.connect(musicFilter);
      o.start(t); o.stop(t + CHORD_LEN + 1.3); track(o, g);
    });
    [0.9, 2.5].forEach(off => {
      if (Math.random() < 0.35) return;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = BELLS[Math.floor(Math.random() * BELLS.length)];
      const s = t + off;
      g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.05, s + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, s + 2.4);
      o.connect(g); g.connect(musicFilter); o.start(s); o.stop(s + 2.5); track(o, g);
    });
  }
  function pump() {
    if (!ctx) return;
    while (nextChordAt < ctx.currentTime + 1.2) { scheduleChord(nextChordAt); nextChordAt += CHORD_LEN; }
  }
  function startMusic() {
    if (!ctx || schedTimer) return;
    const now = ctx.currentTime;
    musicBus.gain.cancelScheduledValues(now);
    musicBus.gain.setTargetAtTime(MUSIC_VOL, now, 0.8);
    nextChordAt = now + 0.1;
    schedTimer = setInterval(pump, 300); pump();
  }
  function stopMusic() {
    if (schedTimer) { clearInterval(schedTimer); schedTimer = null; }
    if (!ctx) return;
    const now = ctx.currentTime;
    musicBus.gain.cancelScheduledValues(now);
    musicBus.gain.setTargetAtTime(0, now, 0.15);
    liveMusic.forEach(o => { try { o.stop(now + 0.7); } catch (e) {} });
  }
  function ready() { return sfxOn && ctx && ctx.state === 'running'; }

  function tick(speed) {
    if (!ready()) return;
    const t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
    const f = 1350 + Math.random() * 120 - Math.min(speed, 1000) * 0.1;
    const vol = 0.24 - 0.1 * Math.min(speed / 1000, 1);
    o.type = 'triangle';
    o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 0.5, t + 0.04);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    o.connect(g); g.connect(sfxBus); o.start(t); o.stop(t + 0.06);
    o.onended = () => { o.disconnect(); g.disconnect(); };
  }
  function startRiser(dur) {
    if (!ready()) return;
    stopRiser();
    const t = ctx.currentTime;
    const o1 = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain();
    o1.type = 'sine'; o2.type = 'triangle';
    o1.frequency.setValueAtTime(240, t); o1.frequency.exponentialRampToValueAtTime(760, t + dur);
    o2.frequency.setValueAtTime(360, t); o2.frequency.exponentialRampToValueAtTime(1140, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.06, t + dur * 0.8);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o1.connect(g); o2.connect(g); g.connect(sfxBus);
    o1.start(t); o2.start(t); o1.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
    const r = { o1, o2, g };
    o1.onended = () => { try { o1.disconnect(); o2.disconnect(); g.disconnect(); } catch (e) {} if (riser === r) riser = null; };
    riser = r;
  }
  function stopRiser() {
    if (!riser || !ctx) return;
    const now = ctx.currentTime, r = riser; riser = null;
    try {
      r.g.gain.cancelScheduledValues(now); r.g.gain.setTargetAtTime(0.0001, now, 0.03);
      r.o1.stop(now + 0.15); r.o2.stop(now + 0.15);
    } catch (e) {}
  }
  function win() {
    if (!ready()) return;
    const t0 = ctx.currentTime + 0.02;
    [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => {
      const t = t0 + i * 0.11;
      [['sine', f, 0.2], ['triangle', f * 2, 0.06]].forEach(([type, fr, vol]) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.value = fr;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 1.7);
        o.connect(g); g.connect(sfxBus); o.start(t); o.stop(t + 1.75);
        o.onended = () => { o.disconnect(); g.disconnect(); };
      });
    });
    for (let i = 0; i < 9; i++) {
      const t = t0 + 0.4 + Math.random() * 0.9, o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = 2200 + Math.random() * 2200;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.035, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
      o.connect(g); g.connect(sfxBus); o.start(t); o.stop(t + 0.55);
      o.onended = () => { o.disconnect(); g.disconnect(); };
    }
  }
  function setSfx(on) {
    sfxOn = on;
    if (!on) stopRiser();
    if (ctx) sfxBus.gain.setTargetAtTime(on ? SFX_VOL : 0, ctx.currentTime, 0.05);
  }
  function setMusic(on) {
    musicOn = on;
    if (on) { if (gestured) startMusic(); } else stopMusic();
  }
  document.addEventListener('visibilitychange', () => {
    if (!ctx || !gestured) return;
    if (document.hidden) ctx.suspend().catch(() => {}); else ctx.resume().catch(() => {});
  });
  return { unlock, tick, startRiser, stopRiser, win, setSfx, setMusic, isSupported: !!AC };
})();

/* ==========================================================================
   8. CONFETTI + MODAL
   ========================================================================== */
const Confetti = (() => {
  const cv = $('#confetti'), c = cv.getContext('2d');
  const COLORS = ['#FFD580', '#FFE9B8', '#FF334D', '#F01935', '#FFF8F5', '#C98F3C'];
  let parts = [], raf = 0, startTs = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function step(now) {
    c.clearRect(0, 0, innerWidth, innerHeight);
    parts.forEach(p => {
      p.vy += 0.2; p.vx *= 0.995; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.fillStyle = p.color;
      c.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); c.restore();
    });
    parts = parts.filter(p => p.y < innerHeight + 30);
    if (parts.length && now - startTs < 6000) raf = requestAnimationFrame(step); else stop();
  }
  function burst() {
    if (reducedMotion.matches) return;
    resize();
    parts = Array.from({ length: 80 }, () => ({
      x: innerWidth / 2 + (Math.random() - .5) * innerWidth * .3, y: innerHeight * .38,
      vx: (Math.random() - .5) * 11, vy: -Math.random() * 12 - 3,
      w: 5 + Math.random() * 6, h: 3 + Math.random() * 5, rot: Math.random() * 6.28,
      vr: (Math.random() - .5) * .35, color: COLORS[Math.floor(Math.random() * COLORS.length)]
    }));
    startTs = performance.now(); cancelAnimationFrame(raf); raf = requestAnimationFrame(step);
  }
  function stop() { cancelAnimationFrame(raf); parts = []; c.clearRect(0, 0, cv.width, cv.height); }
  return { burst, stop };
})();

const Modal = (() => {
  const modal = $('#modal'), card = $('#modalCard'), closeBtn = $('#closeBtn'), shareBtn = $('#shareBtn'), app = $('#app');
  let lastFocus = null, closeTimer = 0;
  $('#mAmount').textContent = PRIZES[WIN_INDEX].label;
  if (navigator.share) shareBtn.hidden = false;

  function open() {
    clearTimeout(closeTimer);
    lastFocus = document.activeElement;
    modal.hidden = false;
    try { app.inert = true; } catch (e) {}
    requestAnimationFrame(() => requestAnimationFrame(() => { modal.classList.add('open'); card.focus({ preventScroll: true }); }));
    Confetti.burst();
  }
  function close() {
    modal.classList.remove('open'); Confetti.stop();
    try { app.inert = false; } catch (e) {}
    closeTimer = setTimeout(() => { modal.hidden = true; }, 380);
    if (lastFocus && lastFocus.focus && !lastFocus.disabled) lastFocus.focus({ preventScroll: true });
  }
  closeBtn.addEventListener('click', close);
  modal.addEventListener('click', e => { if (e.target === modal) close(); });
  shareBtn.addEventListener('click', () => {
    navigator.share({ title: 'Lucky Wheel', text: 'I won ' + PRIZES[WIN_INDEX].label + ' on the Lucky Wheel!' }).catch(() => {});
  });
  document.addEventListener('keydown', e => {
    if (modal.hidden) return;
    if (e.key === 'Escape') { close(); return; }
    if (e.key === 'Tab') {
      const items = [shareBtn, closeBtn].filter(b => !b.hidden);
      const idx = items.indexOf(document.activeElement);
      e.preventDefault();
      const next = e.shiftKey ? (idx <= 0 ? items.length - 1 : idx - 1) : (idx + 1) % items.length;
      items[next].focus();
    }
  });
  return { open, close };
})();

/* ==========================================================================
   9. STATE MACHINE + ANIMATION ENGINE
   ========================================================================== */
const State = { READY: 'READY', SPINNING: 'SPINNING', FINISHED: 'FINISHED' };
let state = State.READY;
let rotation = 0;           // unwrapped wheel rotation, source of truth
let deflect = 0;            // pointer flapper deflection
let rafId = 0;

function setRotation(r) {
  rotation = r;
  wheelEl.style.transform = 'rotate(' + mod(r, 360) + 'deg)';
}
function setPointer(d) {
  pointerEl.style.transform = d > 0.05 ? 'rotate(' + (-d) + 'deg)' : '';
}
function lockButton() {
  spinBtn.disabled = true;
  spinBtn.setAttribute('aria-disabled', 'true');
}

function verifyAlignment(R, finalR) {
  const residual = mod(R - restingResidue(WIN_INDEX) + 180, 360) - 180;
  const underPointer = sectorUnderPointer(R);
  let ok = Math.abs(residual) < 1e-6 && underPointer === WIN_INDEX && R === finalR;
  // Cross-check against the actually rendered geometry.
  const marker = $('#winMarker');
  if (marker) {
    const m = marker.getBoundingClientRect(), s = stageEl.getBoundingClientRect();
    const dx = (m.left + m.width / 2) - (s.left + s.width / 2);
    const above = (m.top + m.height / 2) < (s.top + s.height / 2);
    if (Math.abs(dx) > 1.5 || !above) ok = false;
  }
  return ok;
}

function finishSpin(tl) {
  cancelAnimationFrame(rafId);
  setRotation(tl.finalR);                  // exact target, no accumulated drift
  deflect = 0; setPointer(0);
  AudioEngine.stopRiser();
  if (!verifyAlignment(rotation, tl.finalR)) {
    console.error('Wheel alignment check failed'); // defensive; mathematically unreachable
    setRotation(tl.finalR);
  }
  state = State.FINISHED;
  liveEl.textContent = 'You won ' + PRIZES[WIN_INDEX].label + '!';
  setTimeout(() => { AudioEngine.win(); Modal.open(); }, 450);
}

function runAnimation(tl) {
  let last = null, elapsed = 0, riserOn = false;
  let tickIdx = Math.floor((rotation - SECTOR_ANGLE / 2) / SECTOR_ANGLE);
  function frame(now) {
    if (last === null) last = now;
    const dt = Math.min((now - last) / 1000, 0.05); last = now; elapsed += dt;
    if (elapsed >= tl.total) { finishSpin(tl); return; }
    const { p, v } = sample(tl, elapsed);
    setRotation(p);
    const idx = Math.floor((p - SECTOR_ANGLE / 2) / SECTOR_ANGLE);   // pointer crossed a sector boundary
    if (idx !== tickIdx) { tickIdx = idx; AudioEngine.tick(Math.abs(v)); deflect = 13; }
    if (deflect > 0) { deflect *= Math.exp(-dt * 16); setPointer(deflect); }
    if (!riserOn && tl.riserAt !== null && elapsed >= tl.riserAt) { riserOn = true; AudioEngine.startRiser(tl.riserDur); }
    rafId = requestAnimationFrame(frame);
  }
  rafId = requestAnimationFrame(frame);
}

function startSpin() {
  if (state !== State.READY) return;       // blocks double clicks / keyboard repeats
  state = State.SPINNING;
  SpinStore.consume();                      // allowance consumed immediately
  lockButton();
  AudioEngine.unlock();
  runAnimation(buildTimeline(rotation, reducedMotion.matches));
}

/* ==========================================================================
   10. UI WIRING + INIT
   ========================================================================== */
function bindToggle(btn, handler) {
  btn.addEventListener('click', () => {
    AudioEngine.unlock();
    const on = btn.getAttribute('aria-pressed') !== 'true';
    btn.setAttribute('aria-pressed', String(on));
    handler(on);
  });
}

function init() {
  renderWheel(); renderOverlay(); renderParticles();
  setRotation(0); setPointer(0);

  if (SpinStore.isConsumed()) { state = State.FINISHED; lockButton(); }
  else { state = State.READY; spinBtn.disabled = false; spinBtn.removeAttribute('aria-disabled'); }

  spinBtn.addEventListener('click', startSpin);
  bindToggle($('#musicBtn'), AudioEngine.setMusic);
  bindToggle($('#sfxBtn'), AudioEngine.setSfx);

  const unlockOnce = () => AudioEngine.unlock();
  ['pointerdown', 'keydown', 'touchend'].forEach(ev => document.addEventListener(ev, unlockOnce, { once: true, passive: true }));

  window.addEventListener('storage', e => {          // another tab used the allowance
    if (e.key === SpinStore.KEY && state === State.READY) { state = State.FINISHED; lockButton(); }
  });
  if (!AudioEngine.isSupported) { $('#musicBtn').hidden = true; $('#sfxBtn').hidden = true; }
}
init();
})();
</script>
